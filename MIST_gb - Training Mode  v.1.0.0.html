      const questionDiv = document.querySelector('#question');
const startButton = document.querySelector('#start');
const buttonsDiv = document.querySelector('#buttons');
const clickSound = document.querySelector('#click-sound');

let questionCount = 0;
let correctCount = 0;
let currentQuestion;
let sessionTimeout;

function start() {
  startButton.style.display = 'none';
  buttonsDiv.style.display = 'flex';

  for (let i = 0; i < 10; i++) {
    const button = document.createElement('button');
    button.classList.add('btn');
    button.innerText = i;
    button.onclick = () => answer(i);
    buttonsDiv.appendChild(button);
  }

  preloadSounds(['correct-sound.mp3', 'incorrect-sound.mp3'], nextQuestion);
  // End session after 60 seconds
  sessionTimeout = setTimeout(endSession, 60000);
}

function preloadSounds(soundFiles, callback) {
  let loadedCount = 0;
  soundFiles.forEach((soundFile) => {
    const audio = new Audio(soundFile);
    audio.addEventListener('loadeddata', () => {
      loadedCount++;
      if (loadedCount === soundFiles.length) {
        callback();
      }
    });
    audio.load();
  });
}

function nextQuestion() {
  currentQuestion = questions[Math.floor(Math.random() * questions.length)];
  questionDiv.innerText = currentQuestion;
}

function answer(answer) {
  clickSound.play();
  const correctAnswer = eval(currentQuestion);
  const correct = answer === correctAnswer;

  if (correct) {
    correctCount++;
    questionDiv.innerText = 'Correct!';
    playSound('correct-sound.mp3');
  } else {
    questionDiv.innerText = 'Incorrect!';
    playSound('incorrect-sound.mp3');
  }

  questionCount++;

  // wait 1 second before showing next question
  setTimeout(nextQuestion, 1000);
}

function playSound(soundFile) {
  const audio = new Audio(soundFile);
  audio.play();
}

function endSession() {
  clearTimeout(sessionTimeout);
  questionDiv.innerText = 'END OF TRAINING SESSION!';
  buttonsDiv.style.display = 'none';
